<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Gravion Harness</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0f14;
    --panel: #131a22;
    --line: #22303c;
    --text: #dce6ef;
    --muted: #8fa3b6;
    --accent: #4cc2ff;
    --danger: #ff6b6b;
    --ok: #5ddc9a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 14px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: .04em; }
  #status { color: var(--muted); font-size: 12px; }
  #transcript {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg { border-radius: 8px; padding: 9px 12px; white-space: pre-wrap; word-break: break-word; }
  .msg.you { background: #17222e; border: 1px solid var(--line); }
  .msg.bot { background: var(--panel); border: 1px solid var(--line); }
  .msg.err { background: #2a1418; border: 1px solid #55242c; color: #ffc9c9; }
  .msg .who { color: var(--muted); font-size: 11px; display: block; margin-bottom: 3px; }
  #approval {
    display: none;
    border: 1px solid #6b4a16;
    background: #2a2011;
    border-radius: 8px;
    padding: 10px 12px;
  }
  #approval.on { display: block; }
  #approval .title { color: #ffd591; margin-bottom: 6px; }
  button {
    font: inherit;
    background: #1d2833;
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 6px 12px;
    cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: #123244; border-color: #245a75; }
  button.danger { background: #2f1a1f; border-color: #5b2a34; }
  footer {
    display: flex;
    gap: 8px;
    padding: 12px 16px;
    border-top: 1px solid var(--line);
    background: var(--panel);
  }
  #input { flex: 1; background: #0e141b; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 9px 11px; font: inherit; }
  #mic.listening { border-color: var(--danger); color: var(--danger); }
  .hint { color: var(--muted); font-size: 11px; padding: 0 16px 8px; }
</style>
</head>
<body>
<header>
  <h1>GRAVION HARNESS</h1>
  <span id="status">connecting…</span>
</header>

<div id="transcript"></div>

<div id="approval">
  <div class="title" id="approval-title"></div>
  <button class="primary" id="approve">Approve</button>
  <button class="danger" id="deny">Deny</button>
</div>

<div class="hint">Try: <code>help</code> · <code>status</code> · <code>mode smart</code> · <code>run review the authorised targets</code> · <code>report</code></div>

<footer>
  <input id="input" placeholder="Type a command, or press the mic and speak" autocomplete="off" />
  <button id="mic" title="Speak">🎙 Voice</button>
  <button id="send" class="primary">Send</button>
</footer>

<script>
(function () {
  const transcript = document.getElementById('transcript');
  const input = document.getElementById('input');
  const status = document.getElementById('status');
  const approval = document.getElementById('approval');
  const approvalTitle = document.getElementById('approval-title');
  const micButton = document.getElementById('mic');

  function add(who, text, kind) {
    const node = document.createElement('div');
    node.className = 'msg ' + (kind || '');
    const label = document.createElement('span');
    label.className = 'who';
    label.textContent = who;
    node.appendChild(label);
    node.appendChild(document.createTextNode(text));
    transcript.appendChild(node);
    transcript.scrollTop = transcript.scrollHeight;
  }

  function renderApproval(pending) {
    if (!pending) {
      approval.classList.remove('on');
      return;
    }
    approval.classList.add('on');
    approvalTitle.textContent =
      'Approval requested: ' + pending.title +
      '  [' + (pending.risk || '?') + '] → ' + (pending.target ? pending.target.value : '');
  }

  async function refreshStatus() {
    try {
      const response = await fetch('/api/status');
      const data = await response.json();
      status.textContent =
        'mode ' + data.mode +
        ' · ' + data.targets.length + ' target(s)' +
        ' · ' + data.findings + ' finding(s)' +
        ' · audit ' + (data.audit && data.audit.ok ? 'intact' : 'BROKEN');
      renderApproval(data.pendingApproval);
    } catch (error) {
      status.textContent = 'disconnected';
    }
  }

  async function send(message) {
    if (!message.trim()) { return; }
    add('you', message, 'you');
    try {
      const response = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ message: message })
      });
      const data = await response.json();
      if (data.error) {
        add('harness', data.error, 'err');
      } else {
        add('harness', data.reply || '', 'bot');
      }
      renderApproval(data.pendingApproval);
    } catch (error) {
      add('harness', String(error), 'err');
    }
    refreshStatus();
  }

  document.getElementById('send').addEventListener('click', function () {
    const message = input.value;
    input.value = '';
    send(message);
  });

  input.addEventListener('keydown', function (event) {
    if (event.key === 'Enter') {
      const message = input.value;
      input.value = '';
      send(message);
    }
  });

  document.getElementById('approve').addEventListener('click', async function () {
    await fetch('/api/approval', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ decision: 'approve' })
    });
    renderApproval(null);
    refreshStatus();
  });

  document.getElementById('deny').addEventListener('click', async function () {
    await fetch('/api/approval', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ decision: 'deny' })
    });
    renderApproval(null);
    refreshStatus();
  });

  // Voice control. The browser does the speech recognition locally where it
  // can, and only the transcript is sent to the harness.
  const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!Recognition) {
    micButton.disabled = true;
    micButton.title = 'This browser does not support speech recognition';
  } else {
    const recognition = new Recognition();
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.lang = 'en-US';

    recognition.addEventListener('result', function (event) {
      const transcriptText = Array.from(event.results).map(function (r) { return r[0].transcript; }).join('');
      input.value = transcriptText;
      send(transcriptText);
    });

    recognition.addEventListener('end', function () {
      micButton.classList.remove('listening');
    });

    micButton.addEventListener('click', function () {
      if (micButton.classList.contains('listening')) {
        recognition.stop();
        return;
      }
      recognition.start();
      micButton.classList.add('listening');
    });
  }

  refreshStatus();
  setInterval(refreshStatus, 4000);
  input.focus();
})();
</script>
</body>
</html>
